version: "3.8"

networks:
  proxy:
  internal:

volumes:
  mysql_data:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  nginx_acme:
  nginx_dhparam:

services:

  nginx-proxy:
    image: jwilder/nginx-proxy:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    labels:
      com.github.nginx-proxy.nginx: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro,z
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - nginx_dhparam:/etc/nginx/dhparam
    networks:
      - proxy

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion:latest
    container_name: nginx-proxy-le
    restart: unless-stopped
    environment:
      - DEFAULT_EMAIL=shandba92@gmail.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - nginx_acme:/etc/acme.sh
    depends_on:
      - nginx-proxy
    networks:
      - proxy

  agentic-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_app
    restart: unless-stopped
    depends_on:
      - nginx-proxy
      - letsencrypt

    environment:
      # Domain for Gradio / public UI
      VIRTUAL_HOST: "nl2sql.shanmaha.com"
      LETSENCRYPT_HOST: "nl2sql.shanmaha.com"
      LETSENCRYPT_EMAIL: "shandba92@gmail.com"
      VIRTUAL_PORT: "7860"

      # External Host MySQL DB
      MYSQL_HOST: "${DB_HOST}"
      MYSQL_PORT: "${DB_PORT}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"

      # LLM + LangChain
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      ##LANGCHAIN_API_KEY: "${LANGCHAIN_API_KEY}"
      LLM_MODEL: "${LLM_MODEL}"

      # ==== LangSmith / LangChain Observability (IMPORTANT) ====
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
      LANGCHAIN_API_KEY: "${LANGCHAIN_API_KEY}"     # ← use your lsv2_sk key
      LANGCHAIN_PROJECT: "agentic-production"
    
    ports:
    - "7860:7860"    # Gradio UI port
    - "8080:8080"    # MCP API port  

    expose:
      - "7860"
      - "8080"

    networks:
      - proxy
      - internal
